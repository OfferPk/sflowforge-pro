<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgDarkSFlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#01030a"/>
    </linearGradient>
    <linearGradient id="accentGradSFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgDarkSFlow)"/>

  <!-- Top App Header -->
  <rect x="30" y="24" width="1140" height="60" rx="10" fill="#0b152d" stroke="#192749" stroke-width="1.5"/>
  <rect x="46" y="38" width="95" height="32" rx="8" fill="url(#accentGradSFlow)"/>
  <text x="93" y="59" fill="#020617" font-family="-apple-system, sans-serif" font-weight="900" font-size="12" text-anchor="middle">sFlow v5</text>
  
  <text x="155" y="55" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="800" font-size="18">sFlowForge Pro</text>
  <text x="360" y="55" fill="#22d3ee" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">v1.0.0</text>
  <text x="410" y="55" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">| Multi-Gigabit InMon sFlow v5 Sampling Studio</text>

  <rect x="850" y="40" width="150" height="28" rx="14" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.4"/>
  <text x="925" y="58" fill="#22d3ee" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" text-anchor="middle">RFC 3176 / XDR</text>

  <rect x="1015" y="40" width="145" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="1087" y="58" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" text-anchor="middle">ZERO-TRUST VERIFIED</text>

  <!-- Left Column: Sampling Parameters & Agent Scope -->
  <rect x="30" y="100" width="555" height="545" rx="12" fill="#0b152d" stroke="#192749" stroke-width="1.5"/>
  <text x="50" y="130" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">1. Link Sizing &amp; Sampling Rate Calibration</text>

  <rect x="50" y="145" width="245" height="48" rx="6" fill="#020617" stroke="#192749"/>
  <text x="60" y="163" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">PORT LINK SPEED</text>
  <text x="60" y="182" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">400 Gbps (Hyperscale Spine)</text>

  <rect x="315" y="145" width="250" height="48" rx="6" fill="#020617" stroke="#192749"/>
  <text x="325" y="163" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">SAMPLING INTERVAL (1:N)</text>
  <text x="325" y="182" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">1:4000 (Nyquist Calibrated)</text>

  <!-- Calculation Box -->
  <rect x="50" y="205" width="515" height="45" rx="6" fill="#070e20" stroke="#192749"/>
  <text x="65" y="225" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">SAMPLING SIZING CALCULATION:</text>
  <text x="65" y="242" fill="#38bdf8" font-family="monospace" font-size="11">400G Port (~62.5M pps) &rarr; 1:4000 Sampling Yields ~15,625 samples/sec</text>

  <!-- Header depth & Polling -->
  <rect x="50" y="260" width="245" height="48" rx="6" fill="#020617" stroke="#192749"/>
  <text x="60" y="278" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">HEADER TRUNCATION DEPTH</text>
  <text x="60" y="297" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">128 bytes (Full VXLAN/Geneve)</text>

  <rect x="315" y="260" width="250" height="48" rx="6" fill="#020617" stroke="#192749"/>
  <text x="325" y="278" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">COUNTER POLLING INTERVAL</text>
  <text x="325" y="297" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">20 seconds (Near Real-Time)</text>

  <!-- Hardening Controls Grid -->
  <text x="50" y="335" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">2. Sampling Observability &amp; Buffer Controls</text>
  <rect x="50" y="345" width="245" height="50" rx="6" fill="#070e20" stroke="#10b981" stroke-width="1.2"/>
  <text x="65" y="365" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">🔒 64-Bit High-Capacity Counters</text>
  <text x="65" y="383" fill="#94a3b8" font-family="monospace" font-size="10">Zero counter wrap on 400G</text>

  <rect x="315" y="345" width="250" height="50" rx="6" fill="#070e20" stroke="#10b981" stroke-width="1.2"/>
  <text x="330" y="365" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">🛡️ Drop Packet Accounting</text>
  <text x="330" y="383" fill="#94a3b8" font-family="monospace" font-size="10">ASIC sample queue monitoring</text>

  <rect x="50" y="405" width="245" height="50" rx="6" fill="#070e20" stroke="#10b981" stroke-width="1.2"/>
  <text x="65" y="425" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">🏷️ Extended Switch (VLAN) Data</text>
  <text x="65" y="443" fill="#94a3b8" font-family="monospace" font-size="10">Captures 802.1Q tags &amp; priority</text>

  <rect x="315" y="405" width="250" height="50" rx="6" fill="#070e20" stroke="#10b981" stroke-width="1.2"/>
  <text x="330" y="425" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">🌐 Extended Router (Next-Hop)</text>
  <text x="330" y="443" fill="#94a3b8" font-family="monospace" font-size="10">Captures L3 next-hop &amp; mask</text>

  <rect x="50" y="470" width="515" height="45" rx="6" fill="#020617" stroke="#192749"/>
  <text x="65" y="490" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">COLLECTOR &amp; BUFFER TARGETS:</text>
  <text x="65" y="506" fill="#38bdf8" font-family="monospace" font-size="11">Primary: sflow-collector-01 &bull; Backup: sflow-collector-02 &bull; Buffer: 32MB</text>

  <text x="50" y="555" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">&bull; 128B header capture ensures inner tenant IP visibility inside VXLAN packets</text>
  <text x="50" y="580" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">&bull; Dual collector export eliminates single point of telemetry failure</text>
  <text x="50" y="615" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">✅ Compliant with InMon sFlow v5 Specification &amp; Arista EOS</text>

  <!-- Right Column: Scorecard & Wireframe / Synthesizer -->
  <rect x="615" y="100" width="555" height="545" rx="12" fill="#0b152d" stroke="#192749" stroke-width="1.5"/>

  <!-- Score banner -->
  <rect x="635" y="120" width="515" height="65" rx="10" fill="#070e20" stroke="#192749"/>
  <rect x="650" y="128" width="48" height="48" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
  <text x="674" y="160" fill="#34d399" font-family="monospace" font-weight="800" font-size="22" text-anchor="middle">A+</text>
  <text x="715" y="145" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">Zero-Trust Sampling Score: 100 / 100</text>
  <text x="715" y="165" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11">128B Header Depth • 1:4000 Rate • 64-bit Counters • Dual Collector</text>

  <!-- Binary XDR Wireframe Preview -->
  <text x="635" y="210" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">sFlow v5 XDR Binary Wireframe (Hex Dump)</text>
  <rect x="635" y="220" width="515" height="90" rx="8" fill="#020409" stroke="#192749"/>
  <text x="650" y="242" fill="#38bdf8" font-family="monospace" font-size="10">0000:  00 00 00 05 00 00 00 01  0a c8 04 01 00 00 00 01  |................|</text>
  <text x="650" y="262" fill="#38bdf8" font-family="monospace" font-size="10">0010:  00 00 03 e9 00 81 92 8a  00 00 00 02 00 00 00 01  |................|</text>
  <text x="650" y="282" fill="#38bdf8" font-family="monospace" font-size="10">0020:  00 00 00 c8 00 00 09 c5  00 00 00 02 00 00 0f a0  |................|</text>
  <text x="650" y="302" fill="#38bdf8" font-family="monospace" font-size="10">0030:  00 26 25 a0 00 00 00 00  00 00 00 02 00 00 00 04  |.&amp;%.............|</text>

  <!-- Synthesizer Output -->
  <text x="635" y="335" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">Multi-Vendor Synthesizer (Active: Arista EOS)</text>
  <rect x="635" y="345" width="515" height="280" rx="8" fill="#020409" stroke="#192749"/>
  <text x="650" y="370" fill="#64748b" font-family="monospace" font-size="10">! Arista EOS Production sFlow Configuration</text>
  <text x="650" y="395" fill="#c084fc" font-family="monospace" font-size="10">sflow sample 4000</text>
  <text x="650" y="415" fill="#c084fc" font-family="monospace" font-size="10">sflow polling-interval 20</text>
  <text x="650" y="435" fill="#38bdf8" font-family="monospace" font-size="10">sflow destination sflow-collector-01.corp.internal 6343</text>
  <text x="650" y="455" fill="#38bdf8" font-family="monospace" font-size="10">sflow destination sflow-collector-02.corp.internal 6343</text>
  <text x="650" y="485" fill="#34d399" font-family="monospace" font-size="10">sflow source-interface Loopback0</text>
  <text x="650" y="505" fill="#34d399" font-family="monospace" font-size="10">sflow run</text>
  <text x="650" y="545" fill="#94a3b8" font-family="monospace" font-size="10"># Also synthesizes: Cisco NX-OS, Juniper Junos, hsflowd, FastNetMon</text>
  <text x="650" y="575" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">✅ 1-Click Multi-Vendor Telemetry Export</text>
</svg>
