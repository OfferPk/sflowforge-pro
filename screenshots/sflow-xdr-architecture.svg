<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bgArchSFlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#01030a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#bgArchSFlow)"/>

  <text x="500" y="45" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="20" text-anchor="middle">
    Multi-Gigabit Telemetry Architecture: Insecure Sampling vs Zero-Trust sFlow v5
  </text>

  <!-- Left: Flawed Deployment -->
  <rect x="40" y="80" width="430" height="380" rx="10" fill="#14060c" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="55" y="95" width="400" height="34" rx="6" fill="#ef4444" fill-opacity="0.2"/>
  <text x="255" y="118" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Vulnerable: Truncated 64B &amp; Aliased sFlow
  </text>

  <rect x="55" y="145" width="400" height="60" rx="6" fill="#020617" stroke="#242f5d"/>
  <text x="70" y="170" fill="#fca5a5" font-family="monospace" font-size="11">Truncated 64B Headers &bull; 1:50,000 Sampling</text>
  <text x="70" y="190" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="11">Single Collector &bull; 32-bit Counters &bull; No Drop Telemetry</text>

  <rect x="55" y="220" width="400" height="220" rx="6" fill="#1c0710" stroke="#ef4444" stroke-opacity="0.4"/>
  <text x="70" y="245" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">CATASTROPHIC TELEMETRY FAILURE MODES:</text>
  <text x="70" y="275" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; 64B depth truncates VXLAN/Geneve headers; inner tenant IPs lost</text>
  <text x="70" y="305" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; 1:50,000 sampling causes Nyquist aliasing; misses DDoS microbursts</text>
  <text x="70" y="335" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; 32-bit interface counters roll over in &lt;35s on 1G and &lt;1s on 100G</text>
  <text x="70" y="365" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Undersized 2MB socket buffer silently drops UDP packets in kernel</text>
  <text x="70" y="415" fill="#ef4444" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">OVERLAY BLINDNESS &bull; BURST ALIASING &bull; ZERO RESILIENCE</text>

  <!-- Right: Zero-Trust Architecture -->
  <rect x="530" y="80" width="430" height="380" rx="10" fill="#061614" stroke="#10b981" stroke-width="1.5"/>
  <rect x="545" y="95" width="400" height="34" rx="6" fill="#10b981" fill-opacity="0.2"/>
  <text x="745" y="118" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Hardened: sFlowForge Pro Zero-Trust
  </text>

  <rect x="545" y="145" width="400" height="60" rx="6" fill="#020617" stroke="#242f5d"/>
  <text x="560" y="170" fill="#34d399" font-family="monospace" font-size="11">128B Deep Packet Capture &bull; Nyquist Calibrated Rate</text>
  <text x="560" y="190" fill="#38bdf8" font-family="monospace" font-size="11">64-bit High-Capacity Counters &bull; Dual Redundant Collectors</text>

  <rect x="545" y="220" width="400" height="220" rx="6" fill="#071b16" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="560" y="245" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">ENTERPRISE ZERO-TRUST GUARANTEES:</text>
  <text x="560" y="275" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; Full 128B capture exposes inner overlay headers across VXLAN tunnels</text>
  <text x="560" y="305" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; Nyquist-Shannon calibrated rate captures microbursts without CPU strain</text>
  <text x="560" y="335" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; 64-bit octet counters prevent rollover on 400G spine switches</text>
  <text x="560" y="365" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; 32MB socket buffer + dual collector prevents packet dropouts</text>
  <text x="560" y="415" fill="#10b981" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">RFC 3176 &bull; InMon sFlow v5 &bull; ARISTA EOS &amp; CISCO NX-OS</text>
</svg>
